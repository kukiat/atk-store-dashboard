services:
  atk-store:
    image: armdocker123/atk-store:v1.0.37
    container_name: atk-store
    restart: always
    env_file:
      - ./.env
      - /root/atk-store-secrets/aws.env
    ports:
      - "3010:3000"
    # /etc/hosts เคย map hexdas.cloud -> 127.0.1.1 ทำให้ *.hexdas.cloud ใน container พัง
    extra_hosts:
      - "atk.hexdas.cloud:host-gateway"
      - "shelfbox.hexdas.cloud:host-gateway"
      - "hexdas.cloud:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hexdas_proxy"
      # Unique router name — must not collide with atk-store (dashboard)
      - "traefik.http.routers.atk-storex.rule=Host(`atk.hexdas.cloud`)"
      - "traefik.http.routers.atk-storex.entrypoints=websecure"
      - "traefik.http.routers.atk-storex.tls=true"
      - "traefik.http.routers.atk-storex.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.atk-storex.service=atk-storex-svc"
      - "traefik.http.services.atk-storex-svc.loadbalancer.server.port=3000"
      - "traefik.http.services.atk-storex-svc.loadbalancer.server.scheme=http"
    networks:
      - proxy
  atk-store-mqtt:
    image: bunchax/atk-store-mqtt:latest
    container_name: atk-store-mqtt
    restart: always
    env_file:
      - ./.env
      - /root/atk-store-secrets/aws.env
    extra_hosts:
      - "atk.hexdas.cloud:host-gateway"
      - "shelfbox.hexdas.cloud:host-gateway"
      - "hexdas.cloud:host-gateway"
    networks:
      - proxy

  atk-store-dashboard:
    image: bunchax/atk-store-dashboard:latest # เปลี่ยนจาก bunchax/atk-store
    container_name: atk-store-dashboard
    platform: linux/amd64
    restart: always
    ports:
      - "3001:80"
    # /etc/hosts เคย map hexdas.cloud -> 127.0.1.1 ทำให้ *.hexdas.cloud ใน container พัง
    extra_hosts:
      - "atk.hexdas.cloud:host-gateway"
      - "atk-dashboard.hexdas.cloud:host-gateway"
      - "shelfbox.hexdas.cloud:host-gateway"
      - "hexdas.cloud:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hexdas_proxy"
      - "traefik.http.routers.atk-dashboard.rule=Host(`atk-dashboard.hexdas.cloud`)"
      - "traefik.http.routers.atk-dashboard.entrypoints=websecure"
      - "traefik.http.routers.atk-dashboard.tls=true"
      - "traefik.http.routers.atk-dashboard.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.atk-dashboard.service=atk-dashboard-svc"
      - "traefik.http.services.atk-dashboard-svc.loadbalancer.server.port=80"
      - "traefik.http.services.atk-dashboard-svc.loadbalancer.server.scheme=http"
    depends_on:
      - atk-store-dashboard-api
    networks:
      - proxy

  atk-store-dashboard-api:
    image: bunchax/atk-store-dashboard-api:latest
    platform: linux/amd64
    container_name: atk-store-dashboard-api
    restart: always
    env_file:
      - ./atk-store-dashboard-api/.env
    ports:
      - "3004:3004"
    # Boot roster: GET ${ATK_STORE_API_URL}/animation-api/users → atk-store
    depends_on:
      - atk-store
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hexdas_proxy"
      # Dashboard SPA hardcodes API host as atk.hexdas.cloud — serve API on both hosts
      - "traefik.http.routers.atk-store-api.rule=(Host(`atk.hexdas.cloud`) || Host(`atk-dashboard.hexdas.cloud`)) && (PathPrefix(`/users`) || PathPrefix(`/shelfs`) || PathPrefix(`/sessions`) || PathPrefix(`/crowd`) || PathPrefix(`/groups`) || PathPrefix(`/swagger`) || Path(`/health-check`))"
      - "traefik.http.routers.atk-store-api.entrypoints=websecure"
      - "traefik.http.routers.atk-store-api.tls=true"
      - "traefik.http.routers.atk-store-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.atk-store-api.priority=100"
      - "traefik.http.routers.atk-store-api.service=atk-store-api-svc"
      - "traefik.http.services.atk-store-api-svc.loadbalancer.server.port=3004"
      - "traefik.http.services.atk-store-api-svc.loadbalancer.server.scheme=http"
    networks:
      - proxy

  shelfbox:
    image: bunchax/shelfbox-frontend:latest
    platform: linux/amd64
    container_name: shelfbox
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - ./shelfbox-ui/.env
    # BFF /api/atk/* → ATK /api/iot/* (x-iot-api-key; ATK_API_KEY from atk/.env)
    extra_hosts:
      - "atk.hexdas.cloud:host-gateway"
      - "shelfbox.hexdas.cloud:host-gateway"
      - "hexdas.cloud:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hexdas_proxy"
      - "traefik.http.routers.shelfbox.rule=Host(`shelfbox.hexdas.cloud`)"
      - "traefik.http.routers.shelfbox.entrypoints=websecure"
      - "traefik.http.routers.shelfbox.tls=true"
      - "traefik.http.routers.shelfbox.tls.certresolver=mytlschallenge"
      - "traefik.http.services.shelfbox-svc.loadbalancer.server.port=3002"
      - "traefik.http.services.shelfbox-svc.loadbalancer.server.scheme=http"
    depends_on:
      - shelfbox-backend
      - atk-store
    networks:
      - proxy

  shelfbox-backend:
    image: bunchax/shelfbox-backend:latest
    container_name: shelfbox-backend
    restart: always
    env_file:
      - ./shelftbox-api/.env
    extra_hosts:
      - "atk.hexdas.cloud:host-gateway"
      - "shelfbox.hexdas.cloud:host-gateway"
      - "hexdas.cloud:host-gateway"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hexdas_proxy"
      # อย่าจับ /api/atk — เป็น Next.js BFF บน shelfbox frontend
      - "traefik.http.routers.shelfbox-api.rule=Host(`shelfbox.hexdas.cloud`) && (PathPrefix(`/api/v1`) || Path(`/health`))"
      - "traefik.http.routers.shelfbox-api.entrypoints=websecure"
      - "traefik.http.routers.shelfbox-api.tls=true"
      - "traefik.http.routers.shelfbox-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.shelfbox-api.priority=100"
      - "traefik.http.routers.shelfbox-api.service=shelfbox-api-svc"
      - "traefik.http.services.shelfbox-api-svc.loadbalancer.server.port=8081"
      - "traefik.http.services.shelfbox-api-svc.loadbalancer.server.scheme=http"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: hexdas_proxy
